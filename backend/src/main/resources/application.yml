spring:
  application:
    name: rental-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rental}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:1234}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - openid
              - profile
              - email

server:
  port: 8080
  # เคารพ X-Forwarded-* จาก nginx (เช่น https ตอน deploy) เวลาสร้าง redirect URI ของ Google login
  forward-headers-strategy: framework
  error:
    include-message: always
  servlet:
    session:
      cookie:
        name: RENTAL_SESSION
        http-only: true
        same-site: lax

app:
  # URL ของ frontend ที่ backend จะ redirect กลับไปหลัง login/logout สำเร็จ
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  # รายชื่ออีเมลที่ whitelist ไว้ล่วงหน้าให้เป็น STAFF / ADMIN (คั่นด้วย comma)
  admin-emails: ${ADMIN_EMAILS:}
  staff-emails: ${STAFF_EMAILS:}
  upload-dir: ${UPLOAD_DIR:uploads}
  gemini:
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:}

logging:
  level:
    org.springframework.security: INFO
