# Trigger on pushes and pull requests to the backend-customer branch.
name: CI

on:
  push:
    branches:
      - backemd-customer

  pull_request:
    branches:
      - backemd-customer

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    services:
        postgres:
          image: postgres:17
          env:
            POSTGRES_DB: rental
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
          ports:
            - 5432:5432
          options: >-
            --health-cmd="pg_isready -U postgres -d rental"
            --health-interval=10s
            --health-timeout=5s
            --health-retries=5

    steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up JDK 21
          uses: actions/setup-java@v5
          with:
            java-version: '21'
            distribution: 'temurin'
            cache: maven

        - name: Build and test backend
          working-directory: rental
          env:
            SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/rental
            SPRING_DATASOURCE_USERNAME: postgres
            SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
          run: ./mvnw clean verify

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm run build